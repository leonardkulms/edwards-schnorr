[package]
name = "create-and-send"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "create-and-send"
path = "src/main.rs"

[[bin]]
name = "verify"
path = "src/verify.rs"

[dependencies]
solana-sdk = "1.17.12"
solana-client = "1.17.12"
solana-rpc-client = "1.17.12"
bincode = "1.3.3"
hex = "0.4.3"
bs58 = "0.5.0"
tokio = { version = "1.0", features = ["full"] }